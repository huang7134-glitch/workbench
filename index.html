<style>

button,.chip,.rc,.mcell,.cal .d.clk,.arw,.mini,.bdel,.fhead,.ename,.wcol,.db,.tm,.now,.bdate,.daypill button,.sheet-mask,#nav,#top{

}

.inp,.inp.sm{font-size:16px}
h1,h2,h3,p,ul,li{margin:0;padding:0}

.catbar .t i{display:block;height:100%;border-radius:99px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}

.cal .d.e{background:var(--brick-2);color:var(--brick)}
.cal .d.pr{border:1px dashed var(--brick);color:var(--brick);opacity:.75}
.cal .d.today::after{content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--accent)}

.cal .d.clk{cursor:pointer;transition:transform .12s,background .12s}
.cal .d.clk:active{transform:scale(.9)}

.cal .d.p.mk::after{background:#fff}

.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.mcell{height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink2);transition:.12s}
.mcell:active{transform:scale(.96)}

.daypill{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 12px;padding:9px 13px;border-radius:12px;background:var(--accent-2);font-size:12.5px;color:var(--accent)}

.ckwhen .tm.none{background:#fff;color:var(--ink3);border:1px dashed var(--line);font-weight:400;font-size:12.5px}

.exprow{display:flex;align-items:center;gap:10px;margin:12px 2px 0}

.prec{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

  stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}

.elist li{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2)}
.elist li:last-child{border-bottom:0}

.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
</style>

<script>
/* ==================== 基础工具 ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseD = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const fmtMD = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtCN = s => { const d = parseD(s); return `${d.getMonth() + 1}月${d.getDate()}日`; };
/* 跨年时自动带上年份，避免「2月8日」分不清是哪一年 */

function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = JSON.parse(JSON.stringify(DEFAULT));
  const st = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), s);
  if (!Array.isArray(st.elders)) st.elders = [];
  if (!Array.isArray(st.bills)) st.bills = [];
  if (!Array.isArray(st.periods)) st.periods = [];
  if (!Array.isArray(st.removedSeeds)) st.removedSeeds = [];
  if (!st.checkins || typeof st.checkins !== 'object') st.checkins = {};
  if (!st.study || typeof st.study !== 'object') st.study = {};
  // 兼容旧格式：打卡值曾是日期字符串，现在统一为 {d, items, note}
  Object.keys(st.checkins).forEach(mk => {
    const m = st.checkins[mk];
    if (!m || typeof m !== 'object') { delete st.checkins[mk]; return; }
    Object.keys(m).forEach(eid => {
      const e = m[eid];
      if (!e || typeof e !== 'object') { delete m[eid]; return; }
      Object.keys(e).forEach(r => {
        const v = e[r];
        if (typeof v === 'string') e[r] = { d: v, t: '', items: {}, note: '' };
        else if (!v || typeof v !== 'object') delete e[r];
        else {
          if (!v.items || typeof v.items !== 'object') v.items = {};
          if (typeof v.note !== 'string') v.note = '';
          if (typeof v.t !== 'string') v.t = '';
          if (!v.d) v.d = todayStr();
        }
      });
      if (!Object.keys(e).length) delete m[eid];
    });
  });
  return st;
}

  let added = 0;

}

function ckGet(mk, eid, r) {
  const m = state.checkins[mk];
  const v = m && m[eid] && m[eid][r];
  if (!v) return null;
  if (typeof v === 'string') return { d: v, t: '', items: {}, note: '' };
  return v;
}
function ckEnsure(mk, eid, r) {
  if (!state.checkins[mk]) state.checkins[mk] = {};
  const m = state.checkins[mk];
  if (!m[eid]) m[eid] = {};
  if (!m[eid][r] || typeof m[eid][r] !== 'object') {
    const old = m[eid][r];
    m[eid][r] = {
      d: typeof old === 'string' ? old : (ckDate || todayStr()),
      t: ckTime || '',
      items: {},
      note: ''
    };
  }
  if (!m[eid][r].items) m[eid][r].items = {};
  return m[eid][r];
}
function ckToggle(mk, eid, r) {
  if (!state.checkins[mk]) state.checkins[mk] = {};
  const m = state.checkins[mk];
  const has = m[eid] && m[eid][r];
  if (has) {
    delete m[eid][r];
    if (!Object.keys(m[eid]).length) delete m[eid];
  } else {
    ckEnsure(mk, eid, r);
  }
  save();
}
function ckClear(mk, eid, r) {
  const m = state.checkins[mk];
  if (!m || !m[eid]) return;
  delete m[eid][r];
  if (!Object.keys(m[eid]).length) delete m[eid];
  save();
}
function ckStats(mk) {
  const total = state.elders.length * 3;
  let done = 0;
  state.elders.forEach(e => ROUNDS.forEach(r => { if (ckGet(mk, e.id, r.k)) done++; }));
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}
function curRound(d = new Date()) {
  const day = d.getDate();
  return ROUNDS.find(r => day >= r.a && day <= r.b) || ROUNDS[2];
}
/* 当前正在录入的那一轮，由「记录到」的日期决定 */
function activeRound() {
  const day = Number((ckDate || todayStr()).slice(8, 10));
  if (!day) return curRound();
  return ROUNDS.find(r => day >= r.a && day <= r.b) || ROUNDS[2];
}
/* 按楼层分组，保持 FLOORS 顺序 */
function floorGroups() {
  const g = {};
  state.elders.forEach(e => {
    const f = e.floor || '未分组';
    (g[f] = g[f] || []).push(e);
  });
  const order = [...FLOORS, '未分组'].filter(f => g[f]);
  Object.keys(g).forEach(f => { if (!order.includes(f)) order.push(f); });
  return order.map(f => ({ floor: f, list: g[f] }));
}
function personStat(e, mk) {
  let rounds = 0, items = 0;
  ROUNDS.forEach(r => {
    const v = ckGet(mk, e.id, r.k);
    if (v) { rounds++; items += Object.keys(v.items || {}).length; }
  });
  return { rounds, items };
}

function streak() {
  let n = 0, d = todayStr();
  if (!stTotal(d)) d = addDays(d, -1);
  while (n < 999 && stTotal(d) > 0) { n++; d = addDays(d, -1); }
  return n;
}
function sumRange(from, to, key) {
  let t = 0, d = from;
  let guard = 0;
  while (d <= to && guard++ < 400) {
    const s = stGet(d);
    t += key ? (s[key] || 0) : ((s.lang || 0) + (s.xc || 0) + (s.sl || 0));
    d = addDays(d, 1);
  }
  return t;
}

function periodStats() {
  const rs = [...state.periods].sort((a, b) => (a.start < b.start ? -1 : 1));
  const cycles = [];
  for (let i = 1; i < rs.length; i++) {
    const d = diffDays(rs[i - 1].start, rs[i].start);
    if (d >= 10 && d <= 90) cycles.push(d);
  }
  const lens = rs.filter(r => r.end).map(r => diffDays(r.start, r.end) + 1).filter(x => x >= 1 && x <= 15);
  const avgCycle = cycles.length ? Math.round(cycles.reduce((a, b) => a + b, 0) / cycles.length) : 28;
  const avgLen = lens.length ? Math.round(lens.reduce((a, b) => a + b, 0) / lens.length) : 5;
  const last = rs[rs.length - 1] || null;
  const next = last ? addDays(last.start, avgCycle) : null;
  return { rs, cycles, avgCycle, avgLen, last, next };
}

/* ---------- 记账 ---------- */
function viewBill() {
  const monthList = billsOf(billMonth);
  const list = billDay ? monthList.filter(b => b.date === billDay) : monthList;
  const total = sumBills(list);
  const monthTotal = sumBills(monthList);
  const catList = list.filter(b => b.cat === 'cat');
  const catTotal = sumBills(catList);
  const prevTotal = sumBills(billsOf(addMonths(billMonth, -1)));
  let cmp = '';
  if (!billDay && prevTotal > 0) {
    const d = (total - prevTotal) / prevTotal * 100;
    cmp = `较上月 ${d >= 0 ? '+' : ''}${d.toFixed(0)}%`;
  }

  const shown = billFilter === 'cat' ? catList : list;
  const byDate = {};
  shown.forEach(b => { (byDate[b.date] = byDate[b.date] || []).push(b); });
  const dates = Object.keys(byDate).sort().reverse();

  let listHTML = '';
  if (!dates.length) {
    listHTML = `<div class="empty">${billFilter === 'cat'
      ? (billDay ? '这天没有养猫开支' : '本月还没有养猫开支')
      : (billDay ? '这天还没有记账' : '本月还没有记账')}</div>`;
  } else {
    listHTML = dates.map(d => {
      const items = byDate[d].sort((a, b) => (a.id < b.id ? 1 : -1));
      const sum = sumBills(items);
      const dl = d === todayStr() ? '今天' : `${fmtCNF(d)} ${WD[parseD(d).getDay()]}`;
      return `<div class="bdate" data-act="bday" data-d="${d}" style="cursor:pointer"><span>${dl}</span><span class="num">${money(sum)}</span></div>
        ${items.map(b => {
          const c = CATMAP[b.cat] || CATMAP.other;
          return `<div class="bitem">
            <i class="bdot" style="background:${c.c}"></i>
            <div class="bmain">
              <div class="n">${esc(b.note || (b.cat === 'cat' ? (b.sub || '养猫') : c.n))}</div>
              <div class="s">${b.cat === 'cat' ? '养猫 · ' + esc(b.sub || '其他') : c.n}</div>
            </div>
            <div class="bamt num">${money(b.amount)}</div>

  <div class="card">
    <div class="mnav">
      <button class="arw" data-act="blm" data-n="-1">‹</button>

      <button class="arw" data-act="blm" data-n="1" ${billMonth >= mkOf(todayStr()) ? 'disabled' : ''}>›</button>
    </div>
    <div class="row" style="align-items:flex-end">
      <div>
        <div class="big num">${money(total)}</div>
        <div class="tiny" style="margin-top:2px">${billDay ? fmtCNF(billDay) + ' · ' + list.length + ' 笔' : '共 ' + list.length + ' 笔'} ${cmp ? '· ' + cmp : ''}</div>
      </div>
      <div style="text-align:right">
        <div class="tiny">养猫</div>
        <div class="num" style="font-size:16px;font-weight:600;color:var(--brown)">${money(catTotal)}</div>
      </div>
    </div>
  </div>

  ${billDay ? `<div class="daypill">
      <span>只看 ${fmtCNF(billDay)} ${WD[parseD(billDay).getDay()]}${billDay === todayStr() ? '（今天）' : ''}</span>
      <button data-act="blall">看整月 · ${money(monthTotal)}</button>
    </div>` : ''}

  <div class="card" style="padding:0;overflow:hidden">
    <button data-act="toggleAdd" style="width:100%;height:50px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:${billFormOpen ? 'var(--ink3)' : 'var(--accent)'};font-weight:500">
      ${billFormOpen ? '收起' : '＋ 记一笔'}
    </button>
    ${billFormOpen ? `
    <div style="padding:0 16px 16px">
      <div class="amt"><span>¥</span><input id="amtInput" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${esc(billDraft.amount)}"></div>
      <div class="field" style="margin-top:14px">
        <label>分类</label>
        <div class="chips">
          ${CATS.map(c => `<button class="chip ${billCat === c.k ? 'on' : ''}" data-act="pickcat" data-k="${c.k}" style="${billCat === c.k && c.k === 'cat' ? 'background:var(--brown);border-color:var(--brown)' : ''}">${c.n}</button>`).join('')}
        </div>
      </div>
      ${billCat === 'cat' ? `
      <div class="field">
        <label>养猫细分</label>
        <div class="chips">
          ${CATSUBS.map(s => `<button class="chip ${billSub === s ? 'on' : ''}" data-act="picksub" data-k="${s}" style="${billSub === s ? 'background:var(--brown);border-color:var(--brown)' : ''}">${s}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="field">
        <label>备注（可选）</label>
        <input class="inp sm" id="noteInput" placeholder="例如：午饭、打车" maxlength="30" value="${esc(billDraft.note)}">
      </div>

        <button class="chip ${billFilter === 'all' ? 'on' : ''}" data-act="bfilter" data-k="all" style="padding:6px 11px;font-size:12px">全部</button>
        <button class="chip ${billFilter === 'cat' ? 'on' : ''}" data-act="bfilter" data-k="cat" style="padding:6px 11px;font-size:12px;${billFilter === 'cat' ? 'background:var(--brown);border-color:var(--brown)' : ''}">养猫</button>
      </div>
    </div>
    ${listHTML}
  </div>

  ${cats.length ? `
  <div class="sec">分类占比</div>
  <div class="card tight">
    ${cats.map(([k, v]) => {
      const c = CATMAP[k] || CATMAP.other;
      return `<div class="catbar">
        <div class="r"><span>${c.n}</span><span class="num tiny">${money(v)} · ${Math.round(v / total * 100)}%</span></div>
        <div class="t"><i style="width:${Math.max(3, v / maxV * 100)}%;background:${c.c}"></i></div>
      </div>`;

  ${catTotal > 0 ? `
  <div class="card" style="background:var(--brown-2);border-color:#E8DFD0">
    <div class="row">
      <div>
        <div class="tiny" style="color:var(--brown)">养猫专项 · ${catList.length} 笔</div>
        <div class="num" style="font-size:22px;font-weight:600;color:var(--brown);margin-top:2px">${money(catTotal)}</div>
      </div>
      <div class="tiny" style="text-align:right;color:var(--brown);opacity:.8">
        均次 ${money(catTotal / catList.length)}<br>
        ${(() => { const g = {}; catList.forEach(b => g[b.sub || '其他'] = (g[b.sub || '其他'] || 0) + Number(b.amount)); const top = Object.entries(g).sort((a, b) => b[1] - a[1])[0]; return '最多 ' + top[0]; })()}
      </div>
    </div>
  </div>` : ''}`;
}

/* ---------- 经期 ---------- */
function viewPeriod() {
  const ps = periodStats();
  const today = todayStr();
  const active = ps.last && !ps.last.end;
  const [y, m] = pMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const startDow = first.getDay();
  const dim = daysInMonth(pMonth);

  // 标记
  const inPeriod = {};
  ps.rs.forEach(r => {
    const end = r.end || today;
    let d = r.start, g = 0;
    while (d <= end && g++ < 40) { inPeriod[d] = 'p'; d = addDays(d, 1); }
  });
  const pred = {};
  if (ps.next) {
    for (let i = 0; i < 3; i++) {
      const s0 = addDays(ps.next, ps.avgCycle * i);
      for (let k = 0; k < ps.avgLen; k++) {
        const d = addDays(s0, k);
        if (!inPeriod[d]) pred[d] = true;
      }
    }
  }

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = `${pMonth}-${pad(d)}`;
    let cls = 'd clk';
    if (inPeriod[ds]) cls += ' p';
    else if (pred[ds]) cls += ' pr';
    if (ds === today) cls += ' today';
    cells += `<div class="${cls}" data-act="pday" data-d="${ds}">${d}</div>`;
  }

  let status = '还没有记录';
  let sub = '点下面按钮开始第一次记录';
  if (active) {
    status = `经期第 ${diffDays(ps.last.start, today) + 1} 天`;
    sub = `本次开始 ${fmtCN(ps.last.start)}`;
  } else if (ps.next) {
    const d = diffDays(today, ps.next);
    status = d >= 0 ? `预计 ${d} 天后` : `已推迟 ${-d} 天`;
    sub = `预计 ${fmtCN(ps.next)} 开始 · 平均周期 ${ps.avgCycle} 天`;
  }

  const recs = [...ps.rs].reverse();

  return `
  <div class="card">
    <div class="tiny">当前状态</div>
    <div class="big" style="margin-top:4px;font-size:26px">${status}</div>
    <div class="tiny" style="margin-top:4px">${sub}</div>
    <div class="chips" style="margin-top:16px">
      ${active
        ? `<button class="btn" data-act="pend" style="background:var(--brick);flex:1">结束本次（今天）</button>`
        : `<button class="btn" data-act="pstart" style="background:var(--brick);flex:1">开始记录（今天）</button>`}
      <button class="btn line" data-act="paddnew">补录</button>
    </div>
  </div>

  <div class="card">
    <div class="mnav">
      <button class="arw" data-act="pm" data-n="-1">‹</button>
      <button class="mbtn" data-act="pmpick">${mkLabel(pMonth)}<u>▾</u></button>
      <button class="arw" data-act="pm" data-n="1" ${pMonth >= mkOf(todayStr()) ? 'disabled' : ''}>›</button>
    </div>
    <div class="cal">
      ${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="h">${w}</div>`).join('')}
      ${cells}
    </div>
    <div class="legend" style="margin-top:12px">
      <div><i style="background:var(--brick)"></i>经期</div>
      <div><i style="background:var(--brick-2);border:1px dashed var(--brick)"></i>预测</div>
    </div>
  </div>

  <div class="card tight">
    <div class="kv"><span>平均周期</span><span class="num">${ps.avgCycle} 天</span></div>
    <div class="kv"><span>平均经期长度</span><span class="num">${ps.avgLen} 天</span></div>
    <div class="kv"><span>已记录</span><span class="num">${ps.rs.length} 次</span></div>
  </div>

  <div class="sec">历史记录</div>
  <div class="card">
    ${!recs.length ? '<div class="empty">暂无记录</div>' : recs.map(r => {
      const len = r.end ? diffDays(r.start, r.end) + 1 : null;
      const idx = ps.rs.findIndex(x => x.id === r.id);
      const cyc = idx > 0 ? diffDays(ps.rs[idx - 1].start, r.start) : null;
      return `<div class="prec">
        <div>
          <div>${fmtCNF(r.start)} – ${r.end ? fmtCNF(r.end) : '进行中'}</div>
          <div class="tiny" style="margin-top:2px">${len ? '经期 ' + len + ' 天' : '已持续 ' + (diffDays(r.start, today) + 1) + ' 天'}${cyc ? ' · 周期 ' + cyc + ' 天' : ''}</div>
        </div>
        <div style="display:flex;align-items:center">
          <button class="btn ghost" data-act="pedit" data-id="${r.id}" style="font-size:12px">改</button>
          <button class="del" data-act="pdel" data-id="${r.id}">删除</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <p class="note" style="padding:0 4px">点日历上的任意一天可以直接补录那天的记录；点月份标题可快速跳到往年月份。预测基于你的平均周期自动推算，仅作参考。数据只保存在本机。</p>`;
}

  <div class="card">

    <div class="row">

/* ==================== 交互 ==================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (tab === 'more') render();
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('已添加到主屏幕'); });

$$('#nav button').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.tab;
  window.scrollTo({ top: 0 });
  render();
}));

function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#sheet').hidden = true;
  document.body.style.overflow = '';
}

let rosterFloor = '二楼';
function rosterSheet() {
  const gs = floorGroups();
  openSheet(`
    <div class="sheet-h"><h3>老人名单</h3><button class="x" data-act="close">完成</button></div>
    <div class="field">
      <label>添加到</label>
      <div class="chips">
        ${FLOORS.map(f => `<button class="chip ${rosterFloor === f ? 'on' : ''}" data-act="rfloor" data-f="${f}">${f}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>姓名（空格、逗号或换行分隔）</label>
      <input class="inp" id="elderInput" placeholder="张三 李四 王五">
    </div>
    <button class="btn block" data-act="addelder">添加</button>
    <div style="margin-top:16px">
      ${!state.elders.length ? '<div class="tiny" style="text-align:center;padding:20px 0">名单为空</div>' :
        gs.map(g => `<div class="sec" style="margin:14px 0 4px">${esc(g.floor)} · ${g.list.length} 人</div>
          <ul class="elist">${g.list.map(e => `<li><span>${esc(e.name)}</span><button class="tiny" data-act="delelder" data-id="${e.id}" style="color:var(--brick)">删除</button></li>`).join('')}</ul>`).join('')}
    </div>
    <p class="note" style="margin-top:14px">删除成员会同时清除其历史打卡记录。共 ${state.elders.length} 人。</p>`);
}

function addEldersFromInput() {
  const el = $('#elderInput');
  if (!el) return;
  const names = el.value.split(/[\s,，、;；\n\r]+/).map(x => x.trim()).filter(Boolean);
  if (!names.length) { toast('请输入姓名'); return; }
  const have = new Set(state.elders.map(e => e.name));
  let n = 0;
  names.forEach(nm => { if (!have.has(nm)) { state.elders.push({ id: uid(), name: nm, floor: rosterFloor }); have.add(nm); n++; } });
  save(true);
  render();
  rosterSheet();
  toast(n ? `已添加 ${n} 人 · ${rosterFloor}` : '都已存在');
}

/* ---------- 打卡明细（6 个护理项） ---------- */
/* 三次一览里那一行：具体日期 + 时刻 */
function ovDateHTML(v) {
  if (!v) return '<b class="none">未打卡</b>';
  return `<b>${esc(v.d ? fmtCNF(v.d) : '—')}</b>${v.t ? `<i>${esc(v.t)}</i>` : ''}`;
}
function detailHTML() {
  const e = state.elders.find(x => x.id === detail.eid);
  if (!e) return `<div class="sheet-h"><h3>未找到</h3><button class="x" data-act="close">关闭</button></div>`;
  const v = ckGet(detail.mk, detail.eid, detail.r);
  const items = (v && v.items) || {};
  const n = Object.keys(items).length;
  return `
  <div class="sheet-h"><h3>${esc(e.name)}</h3><button class="x" data-act="close">关闭</button></div>
  <div class="tiny" style="margin:-8px 0 14px">${esc(e.floor || '未分组')} · ${mkLabel(detail.mk)}</div>
  <table class="ov">
    <tr>
      <th>三次一览</th>
      ${ROUNDS.map(rd => `<th class="${detail.r === rd.k ? 'cur' : ''}" data-act="dround" data-r="${rd.k}">${rd.n}</th>`).join('')}
    </tr>
    <tr class="ovd">
      <td></td>
      ${ROUNDS.map(rd => `<td id="ovd_${rd.k}">${ovDateHTML(ckGet(detail.mk, detail.eid, rd.k))}</td>`).join('')}
    </tr>
    ${ITEMS.map(it => `<tr><td>${it.n}</td>${ROUNDS.map(rd => {
      const vv = ckGet(detail.mk, detail.eid, rd.k);
      const on = !!(vv && vv.items && vv.items[it.k]);
      return `<td id="ov_${rd.k}_${it.k}" class="${on ? 'on' : ''}">${on ? '✓' : (vv ? '·' : '—')}</td>`;
    }).join('')}</tr>`).join('')}
  </table>
  <div class="chips" style="margin-bottom:16px">
    ${ROUNDS.map(rd => {
      const vv = ckGet(detail.mk, detail.eid, rd.k);
      const cnt = vv ? Object.keys(vv.items || {}).length : 0;
      return `<button class="chip ${detail.r === rd.k ? 'on' : ''}" data-act="dround" data-r="${rd.k}">${rd.n}${cnt ? ' · ' + cnt : ''}</button>`;
    }).join('')}
  </div>
  <div class="sec" style="margin:0 0 10px">打卡项 <span id="dCount">${n ? `· 已记 ${n} / 6` : '· 未记录'}</span></div>
  <div class="chips" style="margin-bottom:16px">
    ${ITEMS.map(it => `<button class="chip ${items[it.k] ? 'on' : ''}" data-act="ditem" data-k="${it.k}">${it.n}</button>`).join('')}
  </div>
  ${v ? `
  <div class="field">
    <label>这条记录的时间（可改）</label>
    <div class="row" style="gap:8px">
      <input class="inp sm" type="date" id="dDate" value="${v.d}"
        min="${detail.mk}-01" max="${detail.mk}-${pad(daysInMonth(detail.mk))}" style="flex:1.5">
      <input class="inp sm" type="time" id="dTime" value="${v.t || ''}" style="flex:1">
    </div>
  </div>` : ''}
  <div class="field">
    <label>备注</label>
    <input class="inp sm" id="dNote" value="${esc((v && v.note) || '')}" placeholder="选填">
  </div>
  <div class="chips" style="margin-top:16px">
    <button class="btn sm line" data-act="dclear" style="flex:1">清除本轮</button>
    <button class="btn sm" data-act="close" style="flex:1">完成</button>
  </div>
  <p class="note" style="margin-top:12px">勾选即保存。未勾选任何项时，也可直接点上面的轮次格子快速打卡。</p>`;
}
function openDetail(eid) {
  detail = { eid, mk: ckMonth, r: activeRound().k };
  openSheet(detailHTML());
}
function renderDetail() {
  if (detail) $('#sheetBody').innerHTML = detailHTML();
}

/* 打卡时间：可以直接选几点几分，也可以不记时间 */
function ckTimeSheet() {
  const quick = ['07:30', '08:00', '09:00', '10:00', '14:00', '15:30', '16:00', '20:00'];
  openSheet(`
    <div class="sheet-h"><h3>打卡时间</h3><button class="x" data-act="close">关闭</button></div>
    <div class="field">
      <label>具体时间</label>
      <input class="inp" type="time" id="ckTimeInput" value="${ckTime || ''}">
    </div>
    <div class="chips" style="margin-bottom:16px">
      ${quick.map(t => `<button class="chip ${ckTime === t ? 'on' : ''}" data-act="cktq" data-t="${t}">${t}</button>`).join('')}
      <button class="chip" data-act="cktq" data-t="__now">现在</button>
      <button class="chip" data-act="cktq" data-t="">不记时间</button>
    </div>
    <button class="btn block" data-act="cktsave">确定</button>
    <p class="note" style="margin-top:12px">这里只影响「接下来新打卡」的记录时间，已经记好的可以在老人姓名里单独改。</p>`);
}

/* 补录经期：可指定任意起止日期，从 2025 年往前的历史都能补 */
function periodAddSheet(d) {
  pDraft = { start: d || '', end: '' };
  openSheet(periodAddHTML());
}
function periodAddHTML() {
  const all = state.periods.filter(r => r.start).slice().sort((a, b) => (a.start < b.start ? -1 : 1));
  const earliest = all.length ? all[0].start : '';
  return `
  <div class="sheet-h"><h3>补录经期</h3><button class="x" data-act="close">关闭</button></div>
  <div class="field"><label>开始日期</label><input class="inp" type="date" id="pNewStart" value="${pDraft.start}" max="${todayStr()}"></div>
  <div class="field"><label>结束日期（留空表示还没结束）</label><input class="inp" type="date" id="pNewEnd" value="${pDraft.end}" max="${todayStr()}"></div>
  <button class="btn block" data-act="padd" style="background:var(--brick)">保存这条</button>
  <div class="row" style="margin-top:12px">
    <span class="tiny" id="pAddCount">已记录 ${state.periods.length} 条${earliest ? '，最早一条 ' + fmtCNF(earliest) : ''}</span>
    <button class="btn ghost" data-act="close" style="font-size:13px">完成</button>
  </div>
  <p class="note" style="margin-top:10px">保存后会停在这里，可以直接接着补下一条。点日历上的某一天也能打开这里，开始日期会自动填好。</p>`;
}

/* 某一天都有谁打了卡 */
function dayRows(d) {
  const mk = mkOf(d);
  const m = state.checkins[mk] || {};
  const out = [];
  state.elders.forEach(e => {
    ROUNDS.forEach(rd => {
      const v = m[e.id] && m[e.id][rd.k];
      if (!v) return;
      const dd = v && typeof v === 'object' ? v.d : v;
      if (dd !== d) return;
      out.push({ e, rd, v: typeof v === 'object' ? v : { d: dd, t: '', items: {} } });
    });
  });
  return out;
}

function daySheet(d) {
  const rows = dayRows(d);
  const byFloor = {};
  rows.forEach(r => {
    const f = r.e.floor || '未分组';
    (byFloor[f] = byFloor[f] || []).push(r);
  });
  const totalItems = rows.reduce((a, r) => a + Object.keys(r.v.items || {}).length, 0);
  const detail = Object.keys(byFloor).length
    ? Object.entries(byFloor).map(([f, list]) => `
      <div class="sec" style="margin:14px 0 6px">${esc(f)} · ${list.length} 人次</div>
      ${list.map(r => `<div class="prec">
        <div>
          <div>${esc(r.e.name)} <span class="tiny">· ${r.rd.n}${r.v.t ? ' · ' + r.v.t : ''}</span></div>
          <div class="tiny" style="margin-top:2px">${Object.keys(r.v.items || {}).length
            ? ITEMS.filter(it => r.v.items[it.k]).map(it => it.n).join(' / ')
            : '未记录具体项目'}</div>
        </div>
        <button class="btn ghost" data-act="dopen" data-eid="${r.e.id}" data-r="${r.rd.k}" data-d="${d}" style="font-size:12px">明细</button>
      </div>`).join('')}`).join('')
    : '<div class="empty">这天没有打卡记录</div>';

  openSheet(`
    <div class="sheet-h"><h3>${fmtCNF(d)} ${WD[parseD(d).getDay()]}</h3><button class="x" data-act="close">完成</button></div>
    <div class="kv"><span>打卡人次</span><span class="num">${rows.length}</span></div>
    <div class="kv"><span>记录项目数</span><span class="num">${totalItems}</span></div>
    ${detail}`);
}

function periodEditSheet(id) {
  const r = state.periods.find(x => x.id === id);
  if (!r) return;
  openSheet(`
    <div class="sheet-h"><h3>修改记录</h3><button class="x" data-act="close">完成</button></div>
    <div class="field"><label>开始日期</label><input class="inp" type="date" id="pStart" value="${r.start}" max="${todayStr()}"></div>
    <div class="field"><label>结束日期（留空表示进行中）</label><input class="inp" type="date" id="pEnd" value="${r.end || ''}" max="${todayStr()}"></div>
    <button class="btn block" data-act="psave" data-id="${id}">保存</button>`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;

  if (a === 'close') { closeSheet(); return; }

  if (a === 'ck') {
    const dt = ckGet(ckMonth, el.dataset.eid, el.dataset.r);
    ckToggle(ckMonth, el.dataset.eid, el.dataset.r);
    render();
    const e2 = state.elders.find(x => x.id === el.dataset.eid);
    toast(dt ? '已取消' : `已记录 ${e2 ? e2.name : ''} · ${fmtMD(todayStr())}`);
    return;
  }
  if (a === 'ckm') {
    ckMonth = addMonths(ckMonth, Number(el.dataset.n));
    // 「记录到」跟随月份，避免记录日期跑到别的月份
    const day = Math.min(Number((ckDate || todayStr()).slice(8, 10)) || 1, daysInMonth(ckMonth));
    ckDate = `${ckMonth}-${pad(day)}`;
    render();
    return;
  }
  if (a === 'ckpick') { openPicker('checkin', ckMonth, ''); return; }
  if (a === 'ckdate') { openPicker('ckdate', mkOf(ckDate), ckDate); return; }
  if (a === 'cktime') { ckTimeSheet(); return; }
  if (a === 'cktq') {
    const t = el.dataset.t;
    const inp = $('#ckTimeInput');
    if (inp) inp.value = t === '__now' ? nowHM() : t;
    $$('#sheetBody .chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    return;
  }
  if (a === 'cktsave') {
    const inp = $('#ckTimeInput');
    ckTime = (inp && inp.value) || '';
    closeSheet(); render();
    toast(ckTime ? '记录时间 ' + ckTime : '不记时间，只记日期');
    return;
  }
  if (a === 'cknow') {
    ckDate = todayStr(); ckTime = nowHM(); ckMonth = mkOf(ckDate);
    render();
    toast('已回到此刻 ' + ckTime);
    return;
  }

  /* ---- 通用日历选择器 ---- */
  if (a === 'pickm') {
    picker.mk = addMonths(picker.mk, Number(el.dataset.n));
    $('#sheetBody').innerHTML = pickerHTML();
    return;
  }
  if (a === 'pickmy') {
    const y = Number(picker.mk.slice(0, 4)) + Number(el.dataset.n);
    const nowY = Number(todayStr().slice(0, 4));
    if (y > nowY || y < 2000) return;
    picker.mk = `${y}-${picker.mk.slice(5, 7)}`;
    $('#sheetBody').innerHTML = pickerHTML();
    return;
  }
  if (a === 'pickmon') {
    const y = picker.mk.slice(0, 4);
    picker.mk = `${y}-${pad(Number(el.dataset.m))}`;
    if (picker.kind === 'period') { applyPick(picker.mk + '-01'); return; }
    picker.view = 'day';
    $('#sheetBody').innerHTML = pickerHTML();
    return;
  }
  if (a === 'pickview') {
    picker.view = picker.view === 'month' ? 'day' : 'month';
    $('#sheetBody').innerHTML = pickerHTML();
    return;
  }
  if (a === 'pickd') { applyPick(el.dataset.d); return; }
  if (a === 'picktoday') { applyPick(todayStr()); return; }

  if (a === 'dopen') {
    const dd = el.dataset.d, eid = el.dataset.eid, rk = el.dataset.r;
    closeSheet();
    setTimeout(() => { detail = { eid, mk: mkOf(dd), r: rk }; openSheet(detailHTML()); }, 40);
    return;
  }
  if (a === 'fold') {
    const f = el.dataset.floor;
    const cur = ckOpen[f] !== undefined ? ckOpen[f] : state.elders.length <= 24;
    ckOpen[f] = !cur;
    render();
    return;
  }
  if (a === 'ckfloor') { ckFloor = el.dataset.f; render(); return; }
  if (a === 'bulk') {
    const f = el.dataset.floor;
    const r = activeRound();
    const list = state.elders.filter(x => (x.floor || '未分组') === f && !ckGet(ckMonth, x.id, r.k));
    if (!list.length) { toast('本层本轮都已打卡'); return; }
    if (!confirm(`把「${f}」${list.length} 位老人标记为「${mkLabel(ckMonth)} · ${r.n}」已打卡？\n记录时间：${fmtCNF(ckDate)} ${ckTime}`)) return;
    list.forEach(x => ckEnsure(ckMonth, x.id, r.k));
    save(true); render();
    toast(`已记录 ${list.length} 人`);
    return;
  }
  if (a === 'detail') { openDetail(el.dataset.eid); return; }
  if (a === 'dround') { detail.r = el.dataset.r; renderDetail(); return; }
  if (a === 'ditem') {
    const k = el.dataset.k;
    const had = !!ckGet(detail.mk, detail.eid, detail.r);
    const v = ckEnsure(detail.mk, detail.eid, detail.r);
    if (v.items[k]) delete v.items[k];
    else v.items[k] = 1;
    if (!v.d) v.d = ckDate || todayStr();
    save(true);
    const n = Object.keys(v.items).length;
    el.classList.toggle('on', !!v.items[k]);
    const c = $('#dCount');
    if (c) c.textContent = n ? `· 已记 ${n} / 6` : '· 未记录';
    const tab = $(`.chip[data-act="dround"][data-r="${detail.r}"]`);
    if (tab) {
      const rn = ROUNDS.find(x => x.k === detail.r);
      tab.textContent = rn.n + (n ? ' · ' + n : '');
    }
    const ovc = $(`#ov_${detail.r}_${k}`);
    if (ovc) {
      const on = !!v.items[k];
      ovc.className = on ? 'on' : '';
      ovc.textContent = on ? '✓' : '·';
    }
    render();
    if (!had) renderDetail();  // 首次勾选后把「记录时间」补出来
    return;
  }
  if (a === 'dclear') {
    const e2 = state.elders.find(x => x.id === detail.eid);
    if (!confirm(`清除「${e2 ? e2.name : ''}」本轮的打卡记录？`)) return;
    ckClear(detail.mk, detail.eid, detail.r);
    renderDetail(); render();
    toast('已清除本轮');
    return;
  }

  if (a === 'roster') { rosterSheet(); return; }
  if (a === 'rfloor') { rosterFloor = el.dataset.f; rosterSheet(); return; }
  if (a === 'addelder') { addEldersFromInput(); return; }
  if (a === 'delelder') {
    const id = el.dataset.id;
    const e2 = state.elders.find(x => x.id === id);
    if (!confirm(`删除「${e2 ? e2.name : ''}」？其打卡记录也会清除。`)) return;
    state.elders = state.elders.filter(x => x.id !== id);
    Object.keys(state.checkins).forEach(mk => { if (state.checkins[mk][id]) delete state.checkins[mk][id]; });
    if (e2 && SEED_ELDERS.some(([, ns]) => ns.split(/\s+/).includes(e2.name))) state.removedSeeds.push(e2.name);
    save(true); render(); rosterSheet();
    return;
  }

  if (a === 'std') {
    const n = Number(el.dataset.n);
    const nd = addDays(studyDate, n);
    if (nd > todayStr()) return;
    studyDate = nd;
    render();
    return;
  }
  if (a === 'stdpick') { openPicker('study', mkOf(studyDate), studyDate); return; }
  if (a === 'stdjump') { studyDate = el.dataset.d; render(); return; }
  if (a === 'stadd') {
    const k = el.dataset.k, n = Number(el.dataset.n);
    const cur = stGet(studyDate)[k] || 0;
    stSet(studyDate, k, el.dataset.reset ? 0 : cur + n);
    const inp = $(`input[data-act="stin"][data-k="${k}"]`);
    if (inp) inp.value = stGet(studyDate)[k] || 0;
    $('#studyStats').innerHTML = studyStatsHTML();
    return;
  }

  if (a === 'blm') { billMonth = addMonths(billMonth, Number(el.dataset.n)); billDay = ''; render(); return; }
  if (a === 'blpick') { openPicker('bill', billMonth, billDay); return; }
  if (a === 'blall') { billDay = ''; render(); return; }
  if (a === 'bday') { billDay = el.dataset.d; render(); return; }
  if (a === 'toggleAdd') {
    billFormOpen = !billFormOpen;
    if (billFormOpen) billDraft.date = billDay || todayStr();
    render();
    if (billFormOpen) setTimeout(() => { const i = $('#amtInput'); if (i) i.focus(); }, 100);
    return;
  }
  if (a === 'pickcat') { billCat = el.dataset.k; render(); return; }
  if (a === 'picksub') { billSub = el.dataset.k; render(); return; }
  if (a === 'bfilter') { billFilter = el.dataset.k; render(); return; }
  if (a === 'addbill') {
    const amtEl = $('#amtInput');
    const v = parseFloat((amtEl ? amtEl.value : billDraft.amount) || '');

    state.periods.push({ id: uid(), start: s0, end: e0 || '' });

  if (a === 'psave') {

    deferredPrompt.userChoice.then(r => {

  if (a === 'ckxlsx') { exportCheckinXlsx(ckMonth); return; }
  if (a === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

  if (a === 'import') { const f = $('#importFile'); if (f) f.click(); return; }
  if (a === 'clear') {
    if (!confirm('确定清空所有数据？此操作不可恢复。')) return;

/* ==================== Excel 导出（手写 xlsx，无任何外部依赖） ==================== */
/* 思路：xlsx 就是一个 zip 包，里面装几段固定格式的 XML。
   zip 用 store（不压缩）方式打包，只需自己算 CRC32，不需要 deflate 库。 */

/* 自己实现 UTF-8 编码，避免依赖 TextEncoder（老 WebView / 测试环境可能没有） */
function xlUtf8(str) {
  const out = [];
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length) {
      const c2 = str.charCodeAt(++i);
      const cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    } else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(out);
}
const XL_CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
function xlCrc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = XL_CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function xlZip(files) {
  const now = new Date();
  const dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  const parts = [], cds = [];
  let off = 0;
  files.forEach(f => {
    const name = xlUtf8(f.name);
    const data = typeof f.data === 'string' ? xlUtf8(f.data) : f.data;
    const crc = xlCrc32(data);
    const lh = new Uint8Array(30 + name.length);
    const a = new DataView(lh.buffer);
    a.setUint32(0, 0x04034b50, true);
    a.setUint16(4, 20, true);
    a.setUint16(6, 0x0800, true);
    a.setUint16(8, 0, true);
    a.setUint16(10, dt, true);
    a.setUint16(12, dd, true);
    a.setUint32(14, crc, true);
    a.setUint32(18, data.length, true);
    a.setUint32(22, data.length, true);
    a.setUint16(26, name.length, true);
    lh.set(name, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + name.length);
    const b = new DataView(cd.buffer);
    b.setUint32(0, 0x02014b50, true);
    b.setUint16(4, 20, true);
    b.setUint16(6, 20, true);
    b.setUint16(8, 0x0800, true);
    b.setUint16(10, 0, true);
    b.setUint16(12, dt, true);
    b.setUint16(14, dd, true);
    b.setUint32(16, crc, true);
    b.setUint32(20, data.length, true);
    b.setUint32(24, data.length, true);
    b.setUint16(28, name.length, true);
    b.setUint32(42, off, true);
    cd.set(name, 46);
    cds.push(cd);
    off += lh.length + data.length;
  });
  const cdSize = cds.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array(22);
  const e = new DataView(end.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true);
  e.setUint32(16, off, true);
  return new Blob([...parts, ...cds, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function xlColName(n) {
  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
const xlEsc = s => String(s == null ? '' : s)
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));

/* 单元格样式索引：0 默认 / 1 表头 / 2 大标题 / 3 灰字 / 4 居中框 / 5 左对齐框 / 6 绿底框 / 7 加粗 */
const XL_STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="4"><font><sz val="11"/><color rgb="FF2B2B28"/><name val="等线"/></font><font><b/><sz val="11"/><color rgb="FF2B2B28"/><name val="等线"/></font><font><b/><sz val="15"/><color rgb="FF2B2B28"/><name val="等线"/></font><font><sz val="10"/><color rgb="FF8A8A80"/><name val="等线"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF0F0E6"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAF2EA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFDCDCD2"/></left><right style="thin"><color rgb="FFDCDCD2"/></right><top style="thin"><color rgb="FFDCDCD2"/></top><bottom style="thin"><color rgb="FFDCDCD2"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="9"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

function xlCellXml(v, s, ref) {
  const st = s ? ` s="${s}"` : '';
  if (v === null || v === undefined || v === '') return `<c r="${ref}"${st}/>`;
  if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
  return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xlEsc(v)}</t></is></c>`;
}
function xlSheetXML(sh) {
  const rows = sh.rows || [];
  const defS = sh.defStyle || 0;
  let maxC = 1;
  rows.forEach(r => { if (r && r.length > maxC) maxC = r.length; });
  (sh.merges || []).forEach(m => {
    const last = (m.split(':')[1] || '').replace(/\d+/g, '');
    let n = 0;
    for (let i = 0; i < last.length; i++) n = n * 26 + (last.charCodeAt(i) - 64);
    if (n > maxC) maxC = n;
  });
  let sd = '';
  rows.forEach((r, i) => {
    if (!r || !r.length) return;
    const rn = i + 1;
    let cells = '';
    r.forEach((cell, j) => {
      let v = cell, s = defS;
      if (cell && typeof cell === 'object') { v = cell.v; s = cell.s === undefined ? defS : cell.s; }
      cells += xlCellXml(v, s, xlColName(j + 1) + rn);
    });
    if (!cells) return;
    const h = sh.rowH && sh.rowH[rn];
    sd += `<row r="${rn}"${h ? ` ht="${h}" customHeight="1"` : ''}>${cells}</row>`;
  });
  const fz = sh.freeze || 0;
  const pane = fz
    ? `<pane ySplit="${fz}" topLeftCell="A${fz + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${fz + 1}" sqref="A${fz + 1}"/>`
    : '';
  const cols = (sh.cols || []).length
    ? `<cols>${sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>`
    : '';
  const merges = (sh.merges || []).length
    ? `<mergeCells count="${sh.merges.length}">${sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>`
    : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${xlColName(maxC)}${Math.max(1, rows.length)}"/><sheetViews><sheetView showGridLines="0" workbookViewId="0">${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/>${cols}<sheetData>${sd}</sheetData>${merges}<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/></worksheet>`;
}
function xlWorkbook(sheets) {
  const n = sheets.length;
  const ctSheets = sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  const relSheets = sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  const files = [
    {
      name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${ctSheets}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`
    },
    {
      name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`
    },
    {
      name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`
    },
    {
      name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${relSheets}<Relationship Id="rId${n + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`
    },
    { name: 'xl/styles.xml', data: XL_STYLES }
  ];
  sheets.forEach((s, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: xlSheetXML(s) }));
  return xlZip(files);
}

/* ---- 把某个月的打卡数据整理成 3 张表 ---- */
const H = v => ({ v, s: 1 });
const CB = v => ({ v, s: 4 });
const CL = v => ({ v, s: 5 });
const OK = v => ({ v, s: 6 });

function checkinXlsxSheets(mk) {
  const gs = floorGroups();
  const dim = daysInMonth(mk);
  const now = new Date();
  const at = `${ymd(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const S1 = [], S2 = [];
  const tot = { ppl: 0, r: [0, 0, 0], full: 0, items: 0 };

  /* —— 表1 汇总 —— */
  S1.push([{ v: `${mkLabel(mk)} 护理打卡汇总`, s: 2 }]);
  S1.push([{ v: `统计区间 ${mk}-01 ~ ${mk}-${pad(dim)}　导出时间 ${at}`, s: 3 }]);
  S1.push([]);
  S1.push([H('楼层'), H('人数'), H('月初已打'), H('月中已打'), H('月末已打'), H('三项全打'), H('打卡项次'), H('完成率')]);
  gs.forEach(g => {
    const cnt = [0, 0, 0];
    let full = 0, items = 0;
    g.list.forEach(e => {
      let rounds = 0;
      ROUNDS.forEach((r, i) => {
        const v = ckGet(mk, e.id, r.k);
        if (v) { cnt[i]++; rounds++; items += Object.keys(v.items || {}).length; }
      });
      if (rounds === 3) full++;
    });
    const total3 = g.list.length * 3;
    const done3 = cnt[0] + cnt[1] + cnt[2];
    S1.push([CB(g.floor), CB(g.list.length), CB(cnt[0]), CB(cnt[1]), CB(cnt[2]), CB(full), CB(items),
      CB(total3 ? Math.round(done3 / total3 * 100) + '%' : '—')]);
    tot.ppl += g.list.length;
    tot.r[0] += cnt[0]; tot.r[1] += cnt[1]; tot.r[2] += cnt[2];
    tot.full += full; tot.items += items;
  });
  const tot3 = tot.ppl * 3;
  const done3 = tot.r[0] + tot.r[1] + tot.r[2];
  S1.push([H('合计'), H(tot.ppl), H(tot.r[0]), H(tot.r[1]), H(tot.r[2]), H(tot.full), H(tot.items),
    H(tot3 ? Math.round(done3 / tot3 * 100) + '%' : '—')]);

  const miss = [];
  gs.forEach(g => g.list.forEach(e => {
    const lack = ROUNDS.filter(r => !ckGet(mk, e.id, r.k));
    if (lack.length) miss.push({ floor: g.floor, name: e.name, lack });
  }));
  S1.push([]);
  const base = S1.length + 1;
  S1.push([{ v: `未打全名单（共 ${miss.length} 人）`, s: 7 }]);
  if (miss.length) {
    S1.push([H('楼层'), H('姓名'), H('缺哪几轮'), H('已完成')]);
    miss.forEach(m => S1.push([CB(m.floor), CL(m.name), CB(m.lack.map(r => r.n).join('、')), CB((3 - m.lack.length) + '/3')]));
  } else {
    S1.push([CL('本月全部人员 3 轮均已打卡')]);
  }

  /* —— 表2 个人打卡明细：一人一块，三轮逐项展开 —— */
  S2.push([{ v: `${mkLabel(mk)} 个人打卡明细`, s: 2 }]);
  S2.push([{ v: `共 ${state.elders.length} 人 · 每人 3 轮，逐项列出完成情况（✓ = 已完成）· 导出 ${at}`, s: 3 }]);
  S2.push([]);
  S2.push([H('序号'), H('楼层'), H('姓名'), H('轮次'), H('日期'), H('时间')].concat(ITEMS.map(it => H(it.n)), [H('项数'), H('备注'), H('本月项数')]));
  const mg = ['A1:O1', 'A2:O2'];
  let idx = 0, recs = 0;
  gs.forEach(g => g.list.forEach(e => {
    idx++;
    const start = S2.length + 1;
    const vs = ROUNDS.map(r => ckGet(mk, e.id, r.k));
    const monthItems = vs.reduce((a, v) => a + (v ? Object.keys(v.items || {}).length : 0), 0);
    vs.forEach((v, ri) => {
      const items = (v && v.items) || {};
      const n = Object.keys(items).length;
      if (v) recs++;
      const st = v ? 4 : 8;            // 8 = 未打卡的灰字
      const first = ri === 0;
      const row = [
        { v: first ? idx : '', s: 4 },
        { v: first ? g.floor : '', s: 4 },
        { v: first ? e.name : '', s: 4 },
        { v: ROUNDS[ri].n, s: st },
        { v: v ? (v.d || '—') : '未打卡', s: st },
        { v: v ? (v.t || '—') : '', s: st }
      ];
      ITEMS.forEach(it => row.push(items[it.k] ? OK('✓') : { v: '', s: st }));
      row.push({ v: v ? n : '', s: st });
      row.push({ v: v && v.note ? v.note : '', s: v ? 5 : 8 });
      row.push({ v: first ? monthItems : '', s: 4 });
      S2.push(row);
    });
    mg.push(`A${start}:A${start + 2}`, `B${start}:B${start + 2}`, `C${start}:C${start + 2}`, `O${start}:O${start + 2}`);
  }));

  return {
    sheets: [
      { name: '汇总', rows: S1, cols: [11, 8, 10, 10, 10, 10, 10, 9], merges: ['A1:H1', 'A2:H2', `A${base}:D${base}`], rowH: { 1: 26 }, defStyle: 4 },
      {
        name: '个人打卡明细', rows: S2,
        cols: [6, 9, 11, 7, 13, 8, 8, 8, 8, 9, 8, 8, 8, 22, 10],
        merges: mg, freeze: 4, rowH: { 1: 26 }, defStyle: 4
      }
    ],
    records: recs,
    done: done3,
    people: tot.ppl
  };
}

function exportCheckinXlsx(mk) {
  if (!state.elders.length) { toast('还没有老人名单，先添加名单'); return; }
  let pack;
  try { pack = checkinXlsxSheets(mk); }
  catch (err) { toast('导出失败：' + (err && err.message ? err.message : err)); return; }
  if (!pack.records && !confirm(`${mkLabel(mk)} 还没有任何打卡记录，仍然导出空表？`)) return;
  let blob;
  try { blob = xlWorkbook(pack.sheets); }
  catch (err) { toast('生成文件失败：' + (err && err.message ? err.message : err)); return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `护理打卡_${mkLabel(mk)}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  toast(`已导出 ${mkLabel(mk)} · ${pack.people} 人 ${pack.records} 条记录`);
}

/* ==================== 固定缩放（防止误触放大） ==================== */
// iOS Safari 会忽略 user-scalable=no，这里手动拦掉双指缩放
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => {
  document.addEventListener(t, e => e.preventDefault(), { passive: false });
});
// 双指触摸时阻止页面缩放（安卓 WebView 兜底）
document.addEventListener('touchmove', e => {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* ==================== 启动 ==================== */
mergeSeed();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { });
  });
}
</script>
